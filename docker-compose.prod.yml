version: "3.9"

# Production compose — for local smoke-testing the production images.
# Not used on AWS (ECS Fargate manages containers directly).
# Usage:
#   cp .env.prod.example .env.prod   # fill in real values
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:

services:

  # ── Backing services ─────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mtcdb
      POSTGRES_USER: mtc_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtc_user -d mtcdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Application services ─────────────────────────────────────────────────

  api-server:
    image: ${ECR_REGISTRY}/mtc-api-server:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/api-server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://mtc_user:${POSTGRES_PASSWORD:-changeme}@postgres:5432/mtcdb
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  staff-portal:
    image: ${ECR_REGISTRY}/mtc-staff-portal:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/staff-portal/Dockerfile
    restart: unless-stopped
    networks:
      - app-network
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/portal/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  mtc-website:
    image: ${ECR_REGISTRY}/mtc-website:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/mtc-website/Dockerfile
    restart: unless-stopped
    networks:
      - app-network
    ports:
      - "3001:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
